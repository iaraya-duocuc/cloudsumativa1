spring.application.name=cloudsumativa1
spring.profiles.default=h2
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------- AWS S3 ----------
# Región del bucket (AWS Academy usa us-east-1).
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}
# Nombre del bucket: lo decide el servidor, nunca el cliente.
app.s3.enabled=${S3_ENABLED:false}
spring.cloud.aws.s3.enabled=${app.s3.enabled}
app.s3.bucket=${S3_BUCKET:}
# Credenciales de AWS Academy
app.aws.access-key=${AWS_ACCESS_KEY_ID:}
app.aws.secret-key=${AWS_SECRET_ACCESS_KEY:}
app.aws.session-token=${AWS_SESSION_TOKEN:}
